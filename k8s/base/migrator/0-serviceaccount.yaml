apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrator
  namespace: shopx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migrator
  namespace: shopx
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["migrator"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: migrator
  namespace: shopx
subjects:
  - kind: ServiceAccount
    name: migrator
    namespace: shopx
roleRef:
  kind: Role
  name: migrator
  apiGroup: rbac.authorization.k8s.io

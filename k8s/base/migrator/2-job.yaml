apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-shopx
  namespace: shopx
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: migrator
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -h postgres -p 5432 -U shopx; do
                echo "waiting for postgres..."
                sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      containers:
        - name: migrator
          image: ghcr.io/egortarasov/k8s-hw/migrator:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: migrator
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 128Mi }

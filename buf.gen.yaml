version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: internal/generated
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/generated
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: api
openapi: 3.0.3
info:
  title: Avito
  description: Avito
  version: 0.0.1
servers:
  - url: http://localhost:9999
  - url: https://go.larek.tech
paths:
  /api/register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/login:
    post:
      summary: Login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me:
    get:
      summary: Get current user
      operationId: getMe
      security:
        - SessionToken: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/orders:
    post:
      summary: Create order
      operationId: createOrder
      security:
        - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '202':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/orders/{id}:
    get:
      summary: Get order by id
      operationId: getOrder
      security:
        - SessionToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Token

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 6
          example: secret123
        name:
          type: string
          example: Alice

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          example: secret123

    LoginResponse:
      type: object
      required: [sessionToken]
      properties:
        sessionToken:
          type: string
          example: token-abc

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          example: user-1
        email:
          type: string
          format: email
          example: alice@example.com
        name:
          type: string
          example: Alice

    OrderItem:
      type: object
      required: [sku, qty]
      properties:
        sku:
          type: string
          example: book-1
        qty:
          type: integer
          minimum: 1
          example: 2

    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderStatus:
      type: string
      enum: [new, processing, processed, failed]

    CreateOrderResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          example: order-1
        status:
          $ref: '#/components/schemas/OrderStatus'

    Order:
      type: object
      required: [id, userId, status, items]
      properties:
        id:
          type: string
          example: order-1
        userId:
          type: string
          example: user-1
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'